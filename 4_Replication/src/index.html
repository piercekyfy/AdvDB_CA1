<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replication</title>
    <script>
        const COUCHDB_USER = "<%= COUCHDB_USER %>";
        const COUCHDB_PASS = "<%= COUCHDB_PASS %>";
    </script>
    <style>
        .device-button {
            height: 35px;
            width: 100%;
            margin-bottom: 3px;
            font-size: 16px;
            color: #000;
            background-color: #e0e0e0;
            border: 1px solid #a0a0a0; 
            border-radius: 4px;
            box-shadow: inset 0 1px 0 #fff;
            cursor: pointer;
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
        }

        .device-button:hover {
            background-color: #d0d0d0;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
        }

        .active-device-button, .device-button:active {
            background-color: #c0c0c0;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            border-color: #888;
        }

        body {
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            height: 95vh;
            width: 100vw;
        }

    </style>
</head>
<body style="width: 100vw; height: 95vh; margin: none; border: none; color: black;">
    <div style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; ">
        <div style="width: 80%; height: 60%; display: flex; flex-direction: row;">
            <div style="flex-basis: 40%; flex-grow: 1; background-color: #ffffff; border: 1px solid #999999; display: flex; flex-direction: column;  padding: 2px;">
                <div id="device-button-container" style="display: flex; flex-direction: column;"></div>
                <div style="display: flex; flex-direction: row; margin-top: 15px;">
                    <div id="devices-previous-button" style="width: 50%; margin-right: 5px;"><button class="device-button">Previous</button></div>
                    <div id="devices-next-button" style="width: 50%;"><button class="device-button">Next</button></div>
                </div>
            </div>
            <div style="flex-grow: 2; background-color: #f9f9f9; border: 1px solid #cccccc; padding: 10px;">
                <div style="display: flex; flex-direction: row; justify-content: space-between; width: 100%; height: 10%; gap: 25px">
                    <div>
                        <label>_id</label>
                        <input id='device-field-id' type="text" disabled class="field-input" data-mapping="_id" style="min-width: 50px; min-height: 25px;" />
                    </div>
                    
                    <div>
                        <label>Model Name</label>
                        <input id='device-field-mname' type="text" class="field-input" data-mapping="model_name" style="min-width: 50px; min-height: 25px;" />
                    </div>

                    <div>
                        <label>Brand Name</label>
                        <input id='device-field-bname' type="text" class="field-input" data-mapping="brand_name" style="min-width: 50px; min-height: 25px;" />
                    </div>
                </div>
                <div style="margin-top: 50px; width: 50%;"><button id="device-save-button" class="device-button">Save</button></div>
                
            </div>
        </div>
    </div>
</body>
</html>
